<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yadoru Barter Apps - Pro Edition</title>
    <!-- Library OCR Tesseract.js & Chart.js -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary-color: #6366f1; 
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc; 
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --muted-color: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
        }
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0;
            padding: 20px; 
        }
        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .nav-tabs { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 25px; 
            background: #f1f5f9;
            padding: 6px;
            border-radius: 10px;
        }
        .tab-btn { 
            flex: 1;
            padding: 12px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: transparent;
            color: var(--muted-color);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
        }
        .tab-btn:hover {
            color: var(--text-color);
        }
        .tab-btn.active { 
            background: var(--card-bg); 
            color: var(--primary-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .tab-content { 
            display: none; 
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active { 
            display: block; 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], input[type="file"], input[type="date"], select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        button[type="submit"], .btn-primary, .btn-danger, .btn-secondary {
            border: none;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button[type="submit"], .btn-primary {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
        }
        button[type="submit"]:hover, .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }
        .btn-secondary:hover {
            background-color: #cbd5e1;
        }
        /* Metric Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card-metric {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .card-metric span {
            font-size: 12px;
            color: var(--muted-color);
            font-weight: 600;
            text-transform: uppercase;
        }
        .card-metric h3 {
            margin: 5px 0 0 0;
            font-size: 20px;
            color: var(--primary-color);
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            padding: 14px 12px; 
            border-bottom: 1px solid var(--border-color); 
            text-align: left; 
            font-size: 14px;
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        th:hover {
            background-color: #f1f5f9;
        }
        th span {
            float: right;
            color: var(--muted-color);
            font-size: 12px;
        }
        .empty-row, .loading { 
            text-align: center; 
            color: var(--muted-color); 
            font-style: italic; 
            padding: 30px;
        }
        .grand-total-row {
            background-color: #eef2ff !important;
            font-weight: bold;
        }
        .report-controls, .chart-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Yadoru Barter Apps</h2>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('input')">Input & Scan</button>
            <button class="tab-btn" onclick="switchTab('report')">Report List & Waktu</button>
            <button class="tab-btn" onclick="switchTab('grafik')">Grafik Per User</button>
        </div>
        
        <!-- Tab 1: Input & Scan Screenshot -->
        <div id="inputTab" class="tab-content active">
            <div style="background: #f8fafc; padding: 20px; border-radius: 10px; border: 2px dashed var(--border-color); margin-bottom: 25px; text-align: center;">
                <label for="screenshotInput" style="color: var(--primary-color); cursor: pointer; font-size: 15px; font-weight: 700;">📷 Upload Screenshot Riwayat Gift (Auto-Scan OCR)</label>
                <p style="margin: 5px 0 12px 0; font-size: 13px; color: var(--muted-color);">Pilih gambar screenshot untuk membaca data secara otomatis.</p>
                <input type="file" id="screenshotInput" accept="image/*" style="display: none;">
                <button type="button" class="btn-secondary" onclick="document.getElementById('screenshotInput').click()" style="width: auto; padding: 8px 16px; font-size: 14px;">Pilih Berkas Gambar</button>
                <div id="loadingText" class="loading" style="display:none; margin-top: 10px;">Sedang membaca teks dari gambar... Harap tunggu sebentar.</div>
            </div>

            <form id="giftForm">
                <div class="form-group">
                    <label for="inputDate">Tanggal Transaksi / Input</label>
                    <input type="date" id="inputDate" required>
                </div>

                <div class="form-group">
                    <label for="nama">Nama Subject</label>
                    <input type="text" id="nama" placeholder="Contoh: Zaki" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="jumlah">Jumlah Gift</label>
                    <input type="number" id="jumlah" placeholder="Contoh: 9000" min="1" required>
                </div>
                <button type="submit">Simpan & Akumulasi Data</button>
            </form>
        </div>

        <!-- Tab 2: Report List dengan Filter Tanggal, Nama, Sort, & Auto Numbering -->
        <div id="reportTab" class="tab-content">
            <!-- Ringkasan Statistik -->
            <div class="summary-cards">
                <div class="card-metric">
                    <span>Total Keseluruhan Gift</span>
                    <h3 id="statTotalGift">0</h3>
                </div>
                <div class="card-metric">
                    <span>Jumlah Subject Aktif</span>
                    <h3 id="statTotalSubject">0</h3>
                </div>
            </div>

            <div class="report-controls">
                <div style="flex: 1; min-width: 180px;">
                    <label for="filterDate">Filter Tanggal:</label>
                    <input type="date" id="filterDate" onchange="renderTable()">
                </div>
                <div style="flex: 1; min-width: 180px;">
                    <label for="searchNama">Cari Subject:</label>
                    <input type="text" id="searchNama" placeholder="Ketik nama..." onkeyup="renderTable()">
                </div>
                <div style="flex: 1; min-width: 180px;">
                    <label for="sortSelect">Urutkan:</label>
                    <select id="sortSelect" onchange="renderTable()">
                        <option value="name_asc">Nama (A-Z)</option>
                        <option value="name_desc">Nama (Z-A)</option>
                        <option value="total_desc">Total Gift (Tertinggi)</option>
                        <option value="total_asc">Total Gift (Terendah)</option>
                        <option value="time_desc">Waktu (Terbaru)</option>
                        <option value="time_asc">Waktu (Terlama)</option>
                    </select>
                </div>
                <div>
                    <button type="button" class="btn-secondary" onclick="resetDateFilter()" style="padding: 11px 14px; font-size: 14px;">Semua Tanggal</button>
                </div>
            </div>

            <table id="reportTable">
                <thead>
                    <tr>
                        <th style="width: 50px;">No</th>
                        <th onclick="toggleSortColumn('name')">Nama Subject <span id="sort-icon-name">↕</span></th>
                        <th onclick="toggleSortColumn('time')">Waktu Input Terakhir <span id="sort-icon-time">↕</span></th>
                        <th onclick="toggleSortColumn('total')">Total Gift <span id="sort-icon-total">↕</span></th>
                    </tr>
                </thead>
                <tbody id="giftTableBody">
                    <tr><td colspan="4" class="empty-row">Belum ada data gift yang dimasukkan.</td></tr>
                </tbody>
            </table>

            <div class="action-bar">
                <button type="button" class="btn-secondary" onclick="exportToCSV()" style="width: auto;">📥 Ekspor ke CSV</button>
                <button type="button" class="btn-danger" onclick="resetData()" style="width: auto;">🗑️ Reset Semua Data</button>
            </div>
        </div>

        <!-- Tab 3: Grafik Mingguan Per User (Bisa Setting Tanggal) -->
        <div id="grafikTab" class="tab-content">
            <div class="chart-controls">
                <div style="flex: 1;">
                    <label for="startDate">Mulai Tanggal:</label>
                    <input type="date" id="startDate" onchange="updateCharts()">
                </div>
                <div style="flex: 1;">
                    <label for="endDate">Sampai Tanggal:</label>
                    <input type="date" id="endDate" onchange="updateCharts()">
                </div>
            </div>
            <div style="position: relative; height: 350px;">
                <canvas id="giftChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = todayStr;
        });

        let giftData = JSON.parse(localStorage.getItem('giftDataPro')) || {};

        function saveData() {
            localStorage.setItem('giftDataPro', JSON.stringify(giftData));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(tab === 'input') document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            if(tab === 'report') {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                renderTable();
            }
            if(tab === 'grafik') {
                document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
                initDateFilter();
                updateCharts();
            }
        }

        // Fitur OCR Screenshot Reader
        const screenshotInput = document.getElementById('screenshotInput');
        const loadingText = document.getElementById('loadingText');

        screenshotInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loadingText.style.display = 'block';

            Tesseract.recognize(file, 'eng').then(({ data: { text } }) => {
                loadingText.style.display = 'none';
                parseReceiptText(text);
                screenshotInput.value = '';
            }).catch(err => {
                loadingText.style.display = 'none';
                alert('Gagal membaca gambar.');
                console.error(err);
            });
        });

        function parseReceiptText(text) {
            const lines = text.split('\n');
            let detectedName = "";
            let detectedAmount = 0;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.includes('+')) {
                    let cleanNum = line.replace(/[^0-9]/g, '');
                    if (cleanNum.length > 0) {
                        detectedAmount = parseInt(cleanNum);
                        for (let j = i + 1; j < Math.min(i + 3, lines.length); j++) {
                            let nextLine = lines[j].trim();
                            if (nextLine.length > 1 && !nextLine.includes('2026') && !nextLine.includes('+')) {
                                detectedName = nextLine.split(' ')[0];
                                break;
                            }
                        }
                        break;
                    }
                }
            }

            if (detectedName && detectedAmount > 0) {
                document.getElementById('nama').value = detectedName;
                document.getElementById('jumlah').value = detectedAmount;
                alert(`Berhasil mendeteksi!\nNama: ${detectedName}\nJumlah: ${detectedAmount}`);
            } else {
                alert("Pola otomatis tidak sepenuhnya dikenali. Silakan masukkan data secara manual.");
            }
        }

        document.getElementById('giftForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const selectedDate = document.getElementById('inputDate').value;
            const nama = document.getElementById('nama').value.trim();
            const jumlah = parseInt(document.getElementById('jumlah').value);
            
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            const fullDateTime = `${selectedDate} ${timeString}`;

            if(!giftData[selectedDate]) giftData[selectedDate] = {};
            if(!giftData[selectedDate][nama]) {
                giftData[selectedDate][nama] = { total: 0, lastTime: fullDateTime };
            }
            
            giftData[selectedDate][nama].total += jumlah;
            giftData[selectedDate][nama].lastTime = fullDateTime;
            
            saveData();
            
            document.getElementById('nama').value = '';
            document.getElementById('jumlah').value = '';
            document.getElementById('nama').focus();
            
            alert(`Data Berhasil Disimpan untuk tanggal ${selectedDate}!`);
        });

        function toggleSortColumn(columnType) {
            const sortSelect = document.getElementById('sortSelect');
            if (columnType === 'name') {
                sortSelect.value = (sortSelect.value === 'name_asc') ? 'name_desc' : 'name_asc';
            } else if (columnType === 'total') {
                sortSelect.value = (sortSelect.value === 'total_desc') ? 'total_asc' : 'total_desc';
            } else if (columnType === 'time') {
                sortSelect.value = (sortSelect.value === 'time_desc') ? 'time_asc' : 'time_desc';
            }
            renderTable();
        }

        function resetDateFilter() {
            document.getElementById('filterDate').value = '';
            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('giftTableBody');
            tableBody.innerHTML = '';
            const keyword = document.getElementById('searchNama').value.toLowerCase();
            const filterDate = document.getElementById('filterDate').value;
            const sortBy = document.getElementById('sortSelect').value;

            document.getElementById('sort-icon-name').innerText = sortBy === 'name_asc' ? '▲' : (sortBy === 'name_desc' ? '▼' : '↕');
            document.getElementById('sort-icon-total').innerText = sortBy === 'total_desc' ? '▼' : (sortBy === 'total_asc' ? '▲' : '↕');
            document.getElementById('sort-icon-time').innerText = sortBy === 'time_desc' ? '▼' : (sortBy === 'time_asc' ? '▲' : '↕');

            const aggregated = {};
            let grandTotal = 0;

            const targetDates = filterDate ? [filterDate] : Object.keys(giftData);

            targetDates.forEach(date => {
                if(giftData[date]) {
                    const users = giftData[date];
                    for(let name in users) {
                        if(!aggregated[name]) {
                            aggregated[name] = { total: 0, lastTime: users[name].lastTime };
                        }
                        aggregated[name].total += users[name].total;
                        if(users[name].lastTime > aggregated[name].lastTime) {
                            aggregated[name].lastTime = users[name].lastTime;
                        }
                    }
                }
            });

            const allNames = Object.keys(aggregated);
            allNames.forEach(name => grandTotal += aggregated[name].total);

            // Update Statistik Cards
            document.getElementById('statTotalGift').innerText = grandTotal.toLocaleString();
            document.getElementById('statTotalSubject').innerText = allNames.length;

            let filteredNames = allNames.filter(name => name.toLowerCase().includes(keyword));

            filteredNames.sort((a, b) => {
                if (sortBy === 'name_asc') return a.localeCompare(b);
                if (sortBy === 'name_desc') return b.localeCompare(a);
                if (sortBy === 'total_desc') return aggregated[b].total - aggregated[a].total;
                if (sortBy === 'total_asc') return aggregated[a].total - aggregated[b].total;
                if (sortBy === 'time_desc') return aggregated[b].lastTime.localeCompare(aggregated[a].lastTime);
                if (sortBy === 'time_asc') return aggregated[a].lastTime.localeCompare(aggregated[b].lastTime);
                return 0;
            });

            if (Object.keys(giftData).length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Belum ada data gift yang dimasukkan.</td></tr>`;
                return;
            }

            if (filteredNames.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Tidak ada data subject yang ditemukan untuk filter tersebut.</td></tr>`;
                return;
            }

            let no = 1;
            filteredNames.forEach(name => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${no++}</td>
                    <td><b>${escapeHtml(name)}</b></td>
                    <td><small style="color: var(--muted-color);">📅 ${aggregated[name].lastTime}</small></td>
                    <td><strong style="color:var(--primary-color);">${aggregated[name].total.toLocaleString()}</strong></td>
                `;
                tableBody.appendChild(row);
            });

            const totalRow = document.createElement('tr');
            totalRow.className = 'grand-total-row';
            totalRow.innerHTML = `
                <td colspan="3" style="text-align: right;">TOTAL KESELURUHAN:</td>
                <td>${grandTotal.toLocaleString()}</td>
            `;
            tableBody.appendChild(totalRow);
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,No,Nama Subject,Waktu Input Terakhir,Total Gift\n";
            let no = 1;
            
            const aggregated = {};
            Object.keys(giftData).forEach(date => {
                const users = giftData[date];
                for(let name in users) {
                    if(!aggregated[name]) aggregated[name] = { total: 0, lastTime: users[name].lastTime };
                    aggregated[name].total += users[name].total;
                }
            });

            for(let name in aggregated) {
                csvContent += `${no++},"${name}","${aggregated[name].lastTime}",${aggregated[name].total}\n`;
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "yadoru_gift_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function initDateFilter() {
            const endDateInput = document.getElementById('endDate');
            const startDateInput = document.getElementById('startDate');
            
            if(!endDateInput.value) {
                const today = new Date().toISOString().split('T')[0];
                endDateInput.value = today;
                
                const pastDate = new Date();
                pastDate.setDate(pastDate.getDate() - 6);
                startDateInput.value = pastDate.toISOString().split('T')[0];
            }
        }

        let myChart;
        function updateCharts() {
            const ctx = document.getElementById('giftChart').getContext('2d');
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;
            
            if(!startStr || !endStr) return;

            const labels = [];
            let curr = new Date(startStr);
            const end = new Date(endStr);
            
            while(curr <= end) {
                labels.push(curr.toISOString().split('T')[0]);
                curr.setDate(curr.getDate() + 1);
            }

            const uniqueUsers = new Set();
            labels.forEach(date => {
                if(giftData[date]) {
                    Object.keys(giftData[date]).forEach(user => uniqueUsers.add(user));
                }
            });

            const colorPalette = ['#6366f1', '#ef4444', '#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899'];
            let colorIdx = 0;

            const datasets = [];
            uniqueUsers.forEach(user => {
                const userData = labels.map(date => {
                    if(giftData[date] && giftData[date][user]) {
                        return giftData[date][user].total;
                    }
                    return 0;
                });

                const color = colorPalette[colorIdx % colorPalette.length];
                colorIdx++;

                datasets.push({
                    label: user,
                    data: userData,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3
                });
            });

            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function resetData() {
            if (confirm("Apakah Anda yakin ingin mereset seluruh data?")) {
                localStorage.removeItem('giftDataPro');
                giftData = {};
                renderTable();
                alert("Data berhasil direset.");
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
