<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yadoru Barter Apps</title>
    <!-- Library OCR Tesseract.js & Chart.js -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary-color: #4f46e5; 
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6; 
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0;
            padding: 20px; 
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
        }
        .nav-tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .tab-btn { 
            flex: 1;
            padding: 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            background-color: #e5e7eb;
            color: #4b5563;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn.active { 
            background: var(--primary-color); 
            color: white; 
        }
        .tab-content { 
            display: none; 
        }
        .tab-content.active { 
            display: block; 
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"], input[type="number"], input[type="file"], input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button[type="submit"], .btn-danger {
            width: 100%;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
        }
        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }
        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            margin-bottom: 15px;
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            padding: 12px; 
            border-bottom: 1px solid #e5e7eb; 
            text-align: left; 
            font-size: 14px;
        }
        th {
            background-color: #f9fafb;
            font-weight: 600;
        }
        .empty-row, .loading { 
            text-align: center; 
            color: #6b7280; 
            font-style: italic; 
        }
        .grand-total-row {
            background-color: #e0e7ff !important;
            font-weight: bold;
        }
        .chart-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Yadoru Apps</h2>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('input')">Input & Scan</button>
            <button class="tab-btn" onclick="switchTab('report')">Report List & Waktu</button>
            <button class="tab-btn" onclick="switchTab('grafik')">Grafik Per User</button>
        </div>
        
        <!-- Tab 1: Input & Scan Screenshot -->
        <div id="inputTab" class="tab-content active">
            <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-bottom: 25px;">
                <label for="screenshotInput" style="color: var(--primary-color); cursor: pointer;">📷 Upload Screenshot Riwayat Gift (Auto-Scan)</label>
                <input type="file" id="screenshotInput" accept="image/*" style="margin-top: 8px;">
                <div id="loadingText" class="loading" style="display:none;">Sedang membaca teks dari gambar... Harap tunggu sebentar.</div>
            </div>

            <form id="giftForm">
                <div class="form-group">
                    <label for="inputDate">Tanggal Transaksi / Input</label>
                    <input type="date" id="inputDate" required>
                </div>

                <div class="form-group">
                    <label for="nama">Nama Subject</label>
                    <input type="text" id="nama" placeholder="Contoh: Zaki" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="jumlah">Jumlah Gift</label>
                    <input type="number" id="jumlah" placeholder="Contoh: 9000" min="1" required>
                </div>
                <button type="submit">Simpan & Akumulasi Data</button>
            </form>
        </div>

        <!-- Tab 2: Report List dengan Waktu Input -->
        <div id="reportTab" class="tab-content">
            <div style="margin-bottom: 15px;">
                <input type="text" id="searchNama" placeholder="Cari nama subject..." onkeyup="renderTable()">
            </div>
            <button class="btn-danger" onclick="resetData()">Reset Semua Data</button>

            <table id="reportTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Subject</th>
                        <th>Waktu Input Terakhir</th>
                        <th>Total Gift</th>
                    </tr>
                </thead>
                <tbody id="giftTableBody">
                    <tr><td colspan="4" class="empty-row">Belum ada data gift yang dimasukkan.</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Tab 3: Grafik Mingguan Per User (Bisa Setting Tanggal) -->
        <div id="grafikTab" class="tab-content">
            <div class="chart-controls">
                <div style="flex: 1;">
                    <label for="startDate" style="font-size: 13px; margin-bottom: 4px;">Mulai Tanggal:</label>
                    <input type="date" id="startDate" onchange="updateCharts()">
                </div>
                <div style="flex: 1;">
                    <label for="endDate" style="font-size: 13px; margin-bottom: 4px;">Sampai Tanggal:</label>
                    <input type="date" id="endDate" onchange="updateCharts()">
                </div>
            </div>
            <div style="position: relative; height: 350px;">
                <canvas id="giftChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi tanggal hari ini pada form saat halaman pertama kali dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = todayStr;
        });

        let giftData = JSON.parse(localStorage.getItem('giftDataPro')) || {};

        function saveData() {
            localStorage.setItem('giftDataPro', JSON.stringify(giftData));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(tab === 'input') document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            if(tab === 'report') {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                renderTable();
            }
            if(tab === 'grafik') {
                document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
                initDateFilter();
                updateCharts();
            }
        }

        // Fitur OCR Screenshot Reader
        const screenshotInput = document.getElementById('screenshotInput');
        const loadingText = document.getElementById('loadingText');

        screenshotInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loadingText.style.display = 'block';

            Tesseract.recognize(file, 'eng').then(({ data: { text } }) => {
                loadingText.style.display = 'none';
                parseReceiptText(text);
                screenshotInput.value = '';
            }).catch(err => {
                loadingText.style.display = 'none';
                alert('Gagal membaca gambar.');
                console.error(err);
            });
        });

        function parseReceiptText(text) {
            const lines = text.split('\n');
            let detectedName = "";
            let detectedAmount = 0;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.includes('+')) {
                    let cleanNum = line.replace(/[^0-9]/g, '');
                    if (cleanNum.length > 0) {
                        detectedAmount = parseInt(cleanNum);
                        for (let j = i + 1; j < Math.min(i + 3, lines.length); j++) {
                            let nextLine = lines[j].trim();
                            if (nextLine.length > 1 && !nextLine.includes('2026') && !nextLine.includes('+')) {
                                detectedName = nextLine.split(' ')[0];
                                break;
                            }
                        }
                        break;
                    }
                }
            }

            if (detectedName && detectedAmount > 0) {
                document.getElementById('nama').value = detectedName;
                document.getElementById('jumlah').value = detectedAmount;
                alert(`Berhasil mendeteksi!\nNama: ${detectedName}\nJumlah: ${detectedAmount}`);
            } else {
                alert("Pola otomatis tidak sepenuhnya dikenali. Silakan masukkan data secara manual.");
            }
        }

        // Handle Submit Form dengan Tanggal Custom & Jam Otomatis
        document.getElementById('giftForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const selectedDate = document.getElementById('inputDate').value; // Mengambil tanggal dari input
            const nama = document.getElementById('nama').value.trim();
            const jumlah = parseInt(document.getElementById('jumlah').value);
            
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0]; // Jam saat diinput
            const fullDateTime = `${selectedDate} ${timeString}`;

            if(!giftData[selectedDate]) giftData[selectedDate] = {};
            if(!giftData[selectedDate][nama]) {
                giftData[selectedDate][nama] = { total: 0, lastTime: fullDateTime };
            }
            
            giftData[selectedDate][nama].total += jumlah;
            giftData[selectedDate][nama].lastTime = fullDateTime;
            
            saveData();
            
            // Reset nama dan jumlah saja, pertahankan tanggal agar mudah input history beruntun
            document.getElementById('nama').value = '';
            document.getElementById('jumlah').value = '';
            document.getElementById('nama').focus();
            
            alert(`Data Berhasil Disimpan untuk tanggal ${selectedDate}!`);
        });

        // Render Tabel Report dengan Tanggal & Jam Input
        function renderTable() {
            const tableBody = document.getElementById('giftTableBody');
            tableBody.innerHTML = '';
            const keyword = document.getElementById('searchNama').value.toLowerCase();

            const aggregated = {};
            let grandTotal = 0;

            Object.keys(giftData).forEach(date => {
                const users = giftData[date];
                for(let name in users) {
                    if(!aggregated[name]) {
                        aggregated[name] = { total: 0, lastTime: users[name].lastTime };
                    }
                    aggregated[name].total += users[name].total;
                    if(users[name].lastTime > aggregated[name].lastTime) {
                        aggregated[name].lastTime = users[name].lastTime;
                    }
                }
            });

            const allNames = Object.keys(aggregated);
            allNames.forEach(name => grandTotal += aggregated[name].total);

            const filteredNames = allNames.filter(name => name.toLowerCase().includes(keyword));

            if (allNames.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Belum ada data gift yang dimasukkan.</td></tr>`;
                return;
            }

            if (filteredNames.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Tidak ada data subject yang ditemukan.</td></tr>`;
                return;
            }

            let no = 1;
            filteredNames.forEach(name => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${no++}</td>
                    <td>${escapeHtml(name)}</td>
                    <td><small style="color: #6b7280;">📅 ${aggregated[name].lastTime}</small></td>
                    <td><strong style="color:var(--primary-color);">${aggregated[name].total.toLocaleString()}</strong></td>
                `;
                tableBody.appendChild(row);
            });

            const totalRow = document.createElement('tr');
            totalRow.className = 'grand-total-row';
            totalRow.innerHTML = `
                <td colspan="3" style="text-align: right;">TOTAL KESELURUHAN:</td>
                <td>${grandTotal.toLocaleString()}</td>
            `;
            tableBody.appendChild(totalRow);
        }

        // Inisialisasi default tanggal filter grafik (7 hari terakhir)
        function initDateFilter() {
            const endDateInput = document.getElementById('endDate');
            const startDateInput = document.getElementById('startDate');
            
            if(!endDateInput.value) {
                const today = new Date().toISOString().split('T')[0];
                endDateInput.value = today;
                
                const pastDate = new Date();
                pastDate.setDate(pastDate.getDate() - 6);
                startDateInput.value = pastDate.toISOString().split('T')[0];
            }
        }

        // Render Line Chart Berdasarkan Per User dengan Rentang Tanggal Dinamis
        let myChart;
        function updateCharts() {
            const ctx = document.getElementById('giftChart').getContext('2d');
            
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;
            
            if(!startStr || !endStr) return;

            const labels = [];
            let curr = new Date(startStr);
            const end = new Date(endStr);
            
            while(curr <= end) {
                labels.push(curr.toISOString().split('T')[0]);
                curr.setDate(curr.getDate() + 1);
            }

            const uniqueUsers = new Set();
            labels.forEach(date => {
                if(giftData[date]) {
                    Object.keys(giftData[date]).forEach(user => uniqueUsers.add(user));
                }
            });

            const colorPalette = ['#4f46e5', '#ef4444', '#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899'];
            let colorIdx = 0;

            const datasets = [];
            uniqueUsers.forEach(user => {
                const userData = labels.map(date => {
                    if(giftData[date] && giftData[date][user]) {
                        return giftData[date][user].total;
                    }
                    return 0;
                });

                const color = colorPalette[colorIdx % colorPalette.length];
                colorIdx++;

                datasets.push({
                    label: user,
                    data: userData,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    fill: false,
                    tension: 0.2
                });
            });

            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { 
                    labels: labels, 
                    datasets: datasets 
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function resetData() {
            if (confirm("Apakah Anda yakin ingin mereset seluruh data?")) {
                localStorage.removeItem('giftDataPro');
                giftData = {};
                renderTable();
                alert("Data berhasil direset.");
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
